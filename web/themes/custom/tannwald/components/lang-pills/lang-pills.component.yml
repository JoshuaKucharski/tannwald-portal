$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Language pills'
status: stable
description: 'Sprachen eines Dokuments als Pillen DE EN FR; nicht verfügbare Sprachen grau mit Tooltip „Nicht verfügbar“.'
props:
  type: object
  required:
    - languages
  properties:
    languages:
      type: array
      title: Languages
      description: 'Liste {code, label, url, current, available} in Site-Reihenfolge.'
      items:
        type: object
        properties:
          code:
            type: string
          label:
            type: string
          url:
            type: [string, 'null']
          current:
            type: boolean
          available:
            type: boolean
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Attributes
