tannwald_assistant.settings:
  type: config_object
  label: 'Tannwald assistant settings'
  mapping:
    provider:
      type: string
      label: 'AI provider ID (drupal/ai plugin)'
    chat_model:
      type: string
      label: 'Chat model (raw provider name)'
    embedding_model:
      type: string
      label: 'Embedding model (raw provider name)'
    top_k:
      type: integer
      label: 'Number of chunks in the prompt'
    min_score:
      type: float
      label: 'Minimum RRF score'
    monthly_token_limit:
      type: integer
      label: 'Monthly token limit'
    kosten_pro_1k_chf:
      type: float
      label: 'Cost per 1000 tokens in CHF'
    safety_terms:
      type: mapping
      label: 'Safety terms per language'
      mapping:
        de:
          type: sequence
          label: 'German safety terms'
          sequence:
            type: string
            label: 'Term'
        en:
          type: sequence
          label: 'English safety terms'
          sequence:
            type: string
            label: 'Term'
        fr:
          type: sequence
          label: 'French safety terms'
          sequence:
            type: string
            label: 'Term'
    assistant_enabled:
      type: boolean
      label: 'Assistant enabled'
