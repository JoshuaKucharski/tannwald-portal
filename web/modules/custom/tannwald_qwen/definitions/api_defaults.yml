chat:
  input:
    description: 'Input provided to the model.'
    type: 'array'
    default:
      - { role: "system", content: "You are a helpful assistant." }
      - { role: "user", content: "Antworte mit dem Wort bereit." }
    required: true
  authentication:
    description: 'DashScope API key (key module).'
    type: 'string'
    default: ''
    required: true
  configuration:
    max_tokens:
      label: 'Max Tokens'
      description: 'The maximum number of tokens that can be generated in the chat completion.'
      type: 'integer'
      default: 1024
      required: false
    temperature:
      label: 'Temperature'
      description: 'Sampling temperature 0-2. Higher values mean more random output.'
      type: 'float'
      default: 0.7
      required: false
      constraints:
        min: 0
        max: 2
        step: 0.1
embeddings:
  input:
    description: 'Text to embed.'
    type: 'string'
    default: 'Folie reisst beim Siegeln'
    required: true
  authentication:
    description: 'DashScope API key (key module).'
    type: 'string'
    default: ''
    required: true
  configuration:
    dimensions:
      label: 'Dimensions'
      description: 'Vector size; the myTannwald chunk store expects 1024.'
      type: 'integer'
      default: 1024
      required: true
