# -----------------------------------------------------------------------------
# 2. Projekt
# -----------------------------------------------------------------------------
projekt:
  arbeitstitel: myTannwald Kundenportal
  kurzbeschreibung: >-
    Ein mehrsprachiges Kundenportal, das pro Maschine (Seriennummer) die richtige
    technische Dokumentation bereitstellt, eine hybride Suche über alle Dokumente
    bietet und einen AI-Assistenten, der Fragen belegt mit Quellen beantwortet.
    Dokumente werden mit Azure Blob Storage bidirektional synchronisiert, Berechtigungen
    stammen aus SAP (Kunde, Equipment, Vertrag) und der Exportkontrolle.
  zielgruppen:
    - id: ZG-01
      persona: Instandhaltungs-Ingenieur beim Kunden
      bedarf: Handbuch, Ersatzteilliste, Schaltplan zur eigenen Maschine in Landessprache
      volumen: ca. 25000 Nutzende weltweit
    - id: ZG-02
      persona: Servicetechniker Tannwald (intern, mobil, oft offline)
      bedarf: Schneller Zugriff vor Ort, Service-Bulletins, How-to-Antworten
      volumen: 38 plus 120 Techniker der Ländergesellschaften
    - id: ZG-03
      persona: Händler und Servicepartner
      bedarf: Aktuelle Unterlagen für ihr Gebiet; eingeschränkte Sicht gemäss Vertrag
      volumen: 85 Firmen
    - id: ZG-04
      persona: Technische Redaktion (intern)
      bedarf: Dokumente freigeben, Versionen steuern, AI-Zusammenfassungen prüfen
      volumen: 12 Personen
    - id: ZG-05
      persona: Support-Agent (intern)
      bedarf: Tickets mit Portal-Kontext beantworten; unbeantwortete Fragen sehen
      volumen: 30 Personen
    - id: ZG-06
      persona: Compliance und Exportkontrolle
      bedarf: Freigaben, Sperren, Audit-Trail
      volumen: 3 Personen
  scope_in:
    - Kundenportal mit Login, Rollen und mandantenähnlicher Sicht pro Kundenfirma
    - Download-Portal mit Seriennummern-Bezug, Versionen, Benachrichtigungen
    - Bidirektionale Synchronisation mit Azure Blob Storage
    - Hybride Suche (Volltext und semantisch) mit Facetten und Live-Resultaten
    - AI-Assistent (RAG) mit Quellenangaben, Berechtigungsprüfung, Eskalation
    - Redaktioneller Freigabe-Workflow inkl. Prüfung AI-generierter Zusammenfassungen
    - Schnittstellen zu SAP, Entra ID, Salesforce, PIM, DAM
    - Nutzungs- und Kosten-Dashboard
    - Hosting, Betrieb, Wartung (Offerte separat ausweisen)
  scope_out:
    - Relaunch der Corporate-Website
    - Ersatzteil-Shop mit Bestellung (Phase 3, siehe FA-COM)
    - Ticketsystem-Ersatz (Salesforce bleibt)
    - Eigenes Training von Sprachmodellen
    - Native Mobile-Apps (PWA genügt)

