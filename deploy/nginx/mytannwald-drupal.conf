# myTannwald — Drupal-Regeln für nginx (deploy/nginx, 4.1, ADR-012). bootstrap.sh legt die Datei nach
# /etc/nginx/snippets/mytannwald-drupal.conf; beide Vhost-Fassungen binden sie im server-Block ein.
# Grundlage: offizielles nginx-Rezept für Drupal (nginx.com „Drupal“), ergänzt um die Sperrliste aus web/.htaccess.
# Platzhalter (ersetzt bootstrap.sh): @SOCK@ php-fpm-Socket des Pools „mytannwald“.
# Reihenfolge zählt: Präfix-Orte mit ^~ und exakte Orte zuerst, danach Regex-Orte in Dateireihenfolge.

client_max_body_size 64m;
server_tokens off;
fastcgi_hide_header X-Powered-By;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Demo (4.3): nie in Suchmaschinen — Kopfzeile auf jeder Antwort, robots.txt unten ohne Passwort.
add_header X-Robots-Tag "noindex, nofollow" always;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

location = /favicon.ico { log_not_found off; access_log off; }
# robots.txt kommt aus nginx, nicht aus web/robots.txt (Core-Datei): alles gesperrt, ohne Besucher-Passwort.
location = /robots.txt { auth_basic off; access_log off; default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
# Health-Probe (4.3) ohne Besucher-Passwort; die Drupal-Probe ist /user/login (mit Passwort).
location = /health { auth_basic off; access_log off; default_type text/plain; return 200 "ok\n"; }

# certbot (certonly --nginx) setzt für die Challenge einen exakten Ort; dieser Präfix hält .well-known offen.
location ^~ /.well-known/ { auth_basic off; allow all; try_files $uri =404; }

# Versteckte Dateien und Ordner (.htaccess, .git, .env …).
location ~ (^|/)\. { return 404; }

# Quell- und Konfigurationsdateien (FilesMatch aus web/.htaccess) sowie Text/Markdown; robots.txt steht oben exakt.
location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|ya?ml|info|md|txt|log|dist|lock)(~|\.sw[op]|\.bak|\.orig|\.save)?$ { return 404; }
location ~* /(Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config|yarn\.lock|package(-lock)?\.json)$ { return 404; }
location ~* \.php(~|\.sw[op]|\.bak|\.orig|\.save)$ { return 404; }

# Private Dateien liegen ausserhalb des Docroots und kommen nur über Drupal (/system/files, /dokument/{nid}/download).
location ~ ^/sites/[^/]+/(files/)?private(/|$) { return 404; }
# Nie PHP aus dem Dateien-Ordner (kompilierte Twig-Vorlagen unter files/php …).
location ~ ^/sites/[^/]+/files/.*\.php$ { return 404; }

# Bildstil-Ableitungen und aggregierte CSS/JS: fehlt die Datei, erzeugt Drupal sie; danach liefert nginx direkt.
location ~ ^/sites/[^/]+/files/styles/ { try_files $uri @rewrite; }
location ~ ^/sites/[^/]+/files/(css|js)/ { expires max; try_files $uri @rewrite; }
# Private Auslieferung über Drupal.
location ~ ^(/[a-z\-]+)?/system/files/ { try_files $uri /index.php?$query_string; }

location / { try_files $uri /index.php?$query_string; }
location @rewrite { rewrite ^ /index.php; }

# Einstiegspunkte: index.php und update.php (mit Pfad-Info, z. B. /update.php/selection).
location ~ ^/(index|update)\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    try_files $fastcgi_script_name =404;
    include fastcgi_params;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    fastcgi_read_timeout 120s;
    fastcgi_pass unix:@SOCK@;
}
# Jedes andere PHP (core/install.php, core/rebuild.php, core/authorize.php …) nie direkt.
location ~ \.php(/|$) { return 404; }
