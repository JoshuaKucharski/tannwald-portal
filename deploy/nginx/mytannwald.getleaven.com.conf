# myTannwald — nginx-Vhost mit TLS (deploy/nginx, 4.1, ADR-012). bootstrap.sh schreibt ihn nach
# /etc/nginx/sites-available/@DOMAIN@.conf (Beispiel-Domain: mytannwald.getleaven.com), sobald certbot das
# Zertifikat für @DOMAIN@ und mail.@DOMAIN@ geholt hat (certonly --nginx — certbot ändert diese Datei nicht).
# Muster wie die übrigen Sites der Maschine (firstbiodent.de): 443 ssl, Zertifikat aus /etc/letsencrypt,
# options-ssl-nginx.conf und ssl-dhparams.pem von certbot, Port 80 leitet um.
# Nicht von Hand ändern: aktiv erst nach `nginx -t`, dann `reload` (nie `restart`).

server {
    @LISTEN_HTTP@
    server_name @DOMAIN@ mail.@DOMAIN@;
    location ^~ /.well-known/acme-challenge/ { root @APP@/web; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    @LISTEN_HTTPS@
    server_name @DOMAIN@;
    root @APP@/web;
    index index.php;
    charset utf-8;
    ssl_certificate @LE@/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key @LE@/live/@DOMAIN@/privkey.pem;
    include @LE@/options-ssl-nginx.conf;
    ssl_dhparam @LE@/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log @LOG_DIR@/@DOMAIN@.access.log;
    error_log @LOG_DIR@/@DOMAIN@.error.log;
    @SITE_AUTH@
    include @SNIPPET@;
}

# Mailpit-Oberfläche hinter Basic-Auth (Nutzer und Hash aus /etc/mytannwald/env → @HTPASSWD@).
server {
    @LISTEN_HTTPS@
    server_name mail.@DOMAIN@;
    ssl_certificate @LE@/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key @LE@/live/@DOMAIN@/privkey.pem;
    include @LE@/options-ssl-nginx.conf;
    ssl_dhparam @LE@/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log @LOG_DIR@/@DOMAIN@.access.log;
    error_log @LOG_DIR@/@DOMAIN@.error.log;
    location / {
        auth_basic "Mailpit";
        auth_basic_user_file @HTPASSWD@;
        proxy_pass http://@MAILPIT_UI@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
