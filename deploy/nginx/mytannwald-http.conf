# myTannwald — nginx-Vhost, Fassung OHNE Zertifikat (deploy/nginx, 4.1, ADR-012). bootstrap.sh schreibt sie nach
# /etc/nginx/sites-available/@DOMAIN@.conf, solange unter /etc/letsencrypt/live/@DOMAIN@/ kein Zertifikat liegt —
# certbot (certonly --nginx) braucht diese Port-80-Blöcke für die Challenge. Mit Zertifikat ersetzt bootstrap.sh
# sie durch mytannwald.getleaven.com.conf. Nicht von Hand ändern: aktiv erst nach `nginx -t`, dann `reload`.

server {
    @LISTEN_HTTP@
    server_name @DOMAIN@;
    root @APP@/web;
    index index.php;
    charset utf-8;
    access_log @LOG_DIR@/@DOMAIN@.access.log;
    error_log @LOG_DIR@/@DOMAIN@.error.log;
    @SITE_AUTH@
    include @SNIPPET@;
}

server {
    @LISTEN_HTTP@
    server_name mail.@DOMAIN@;
    access_log @LOG_DIR@/@DOMAIN@.access.log;
    error_log @LOG_DIR@/@DOMAIN@.error.log;
    location ^~ /.well-known/ { root @APP@/web; allow all; try_files $uri =404; }
    location / {
        auth_basic "Mailpit";
        auth_basic_user_file @HTPASSWD@;
        proxy_pass http://@MAILPIT_UI@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
