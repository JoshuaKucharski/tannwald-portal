; myTannwald — php-fpm-Pool „mytannwald“ (deploy/php, 4.1, ADR-012). bootstrap.sh schreibt ihn nach
; /etc/php/8.4/fpm/pool.d/mytannwald.conf (Modus 600, root) — mit den Werten aus /etc/mytannwald/env, darum
; nie committen und nie ausgeben. Aktiv erst nach `php-fpm8.4 -t`, dann `systemctl reload php8.4-fpm`.
; PHP 8.4 läuft neben 8.3 (Pool www der anderen Sites bleibt unberührt); /usr/bin/php bleibt 8.3.
[mytannwald]
user = @RUN_USER@
group = @RUN_GROUP@
listen = @SOCK@
listen.owner = @LISTEN_OWNER@
listen.group = @LISTEN_GROUP@
listen.mode = 0660

; RAM-Budget der Maschine (3.7 GB, 2.6 GB frei): höchstens 4 Prozesse à 256 MB, nur bei Bedarf.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[date.timezone] = Europe/Zurich
php_admin_value[open_basedir] = @OPEN_BASEDIR@
; Core-php_mail geht an Mailpit (nie an den Mailserver der Maschine); symfony_mailer per settings.php-Override.
php_admin_value[sendmail_path] = "@SENDMAIL@"
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; Umgebung für web/sites/default/settings.php (Abschnitt „Server (deploy/)“): nur diese Namen, sonst nichts.
clear_env = yes
env[TANNWALD_DEPLOY] = 1
@ENV_LINES@
