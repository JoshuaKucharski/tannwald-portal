; myTannwald — PHP-CLI-Einstellungen für drush, composer und den Cron (deploy/php, 4.1). bootstrap.sh legt sie
; nach /etc/mytannwald/php/; deploy.sh und tannwald-cron.service laden sie über PHP_INI_SCAN_DIR=:/etc/mytannwald/php
; (der führende Doppelpunkt behält die Standard-Ordner von php8.4-cli).
memory_limit = 512M
date.timezone = Europe/Zurich
sendmail_path = "@SENDMAIL@"
